[tool.black]
line-length = 120
target-version = ["py313"]
extend-exclude = "src/main/@generated/"

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = ["src/main/@generated"]

[tool.ruff.lint]
# E/W: pycodestyle  F: pyflakes  I: isort  UP: pyupgrade
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["event_resolver", "openapi_models"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
exclude = ["src/main/@generated/"]

[tool.pytest.ini_options]
testpaths = ["src/test/python"]
pythonpath = ["src/main", "src/main/@generated", "src/test"]
